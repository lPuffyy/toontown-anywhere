server {
    listen 80;
    root /ot/web/root;
    location ~ /\. { return 404; }
    # the browser version of the game (the built page files)
    location = /play { return 301 /play/; }
    location = /play/manifest.webmanifest {
        alias /ot/web/_play/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
    location /play/ {
        alias /ot/web/_play/;
        index index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
    # the browser cannot open the game's TCP port: it talks WebSocket here and the bridge passes it on
    location = /ws {
        proxy_pass http://127.0.0.1:7390;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /__d { return 204; }
    location ~ ^/_applog/(iPhone[0-9,]+|iPad[0-9,]+)$ {
        limit_except POST { deny all; }
        client_max_body_size 80k;
        proxy_pass http://127.0.0.1:7381/applog_$1;
    }
    # log lines from a test session (?log=1)
    location = /__log {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:7381/__log;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }
    location = /auth {
        proxy_pass http://127.0.0.1:7381/auth;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        client_max_body_size 1k;
    }
    location ~ ^/(recover|setrecovery)$ {
        proxy_pass http://127.0.0.1:7381;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        client_max_body_size 1k;
    }
    location /_ui/ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location = /packs.json { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri =404; }
}
