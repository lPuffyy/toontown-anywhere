name: Release the native apps

# Push a tag like v1.2.0 (it must match __version__ in native/tta_native/__init__.py) and this builds EVERY platform from that one commit
# (Windows app and setup program, iPhone and iPad app; Android and Linux join the same way), signs the Windows update list, and publishes
# one GitHub release holding all the files. Installed apps read the newest release from GitHub and update themselves. "Run workflow" by
# hand builds everything as a trial (no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # One tag builds every platform and publishes one release. The release is a draft until every build has finished, so the platforms can
  # never be out of step: a failed build leaves the draft unpublished (fix it, then run the workflow again for the same tag).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native
      - name: Read the app version, and make sure the tag matches it
        id: v
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('native/tta_native/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the app version $VERSION"; exit 1
          fi
      - name: Find the newest Panda engine build (stage-*)
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("stage-"))] | sort_by(.createdAt) | last | .tagName // ""')
          echo "stage=$TAG" >> "$GITHUB_OUTPUT"
          echo "engine build: $TAG"
      - name: Start the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            gh release create "v${{ steps.v.outputs.version }}" --draft --title "Toontown: Anywhere ${{ steps.v.outputs.version }}" \
              --notes "Windows: download TTAnywhere-Setup.exe (not code-signed yet, so SmartScreen may warn: More info, then Run anyway). iPhone and iPad: add the source https://github.com/${{ github.repository }}/releases/latest/download/altstore.json to SideStore or AltStore. Installed apps update themselves."
          fi

  ios:
    needs: prepare
    uses: ./.github/workflows/ios-app.yml
    with:
      resource_server: ${{ vars.GAME_SERVER_URL || 'https://toontown.puffsco.com' }}
      stage_release: ${{ needs.prepare.outputs.stage || vars.PANDA_STAGE_RELEASE }}
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ github.run_number }}
      release_tag: ${{ github.ref_type == 'tag' && format('v{0}', needs.prepare.outputs.version) || '' }}

  windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the build tools
        run: python -m pip install -r native/requirements.txt pyinstaller pillow

      - name: Read the app version, and make sure the tag matches it
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('native/tta_native/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the app version $VERSION"; exit 1
          fi

      - name: Build the app and the setup program
        working-directory: native
        run: python build_windows.py

      - name: Sign the update list
        working-directory: native
        env:
          TTA_UPDATE_KEY: ${{ secrets.TTA_UPDATE_KEY }}
        run: |
          if [ -z "$TTA_UPDATE_KEY" ]; then echo "Add the repository secret TTA_UPDATE_KEY (the private signing key, hex)"; exit 1; fi
          printf '%s' "$TTA_UPDATE_KEY" > "$RUNNER_TEMP/update.key"
          python tools/sign_tool.py check "$RUNNER_TEMP/update.key"
          python tools/sign_tool.py publish "$RUNNER_TEMP/update.key" "dist/TTAnywhere-$VERSION-windows.zip" release \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/TTAnywhere-$VERSION-windows.zip"
          rm -f "$RUNNER_TEMP/update.key"
          cp "dist/TTAnywhere-Setup-$VERSION.exe" release/
          cp "dist/TTAnywhere-Setup-$VERSION.exe" release/TTAnywhere-Setup.exe     # a name that never changes, for the download button

      - name: Keep the files (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: native/release/*
          retention-days: 7

      - name: Add the Windows files to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" native/release/* --clobber

  publish:
    if: github.ref_type == 'tag'
    needs: [prepare, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (every platform built)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
